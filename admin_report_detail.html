<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신고/분쟁 상세 - 관리자</title>
    <style>
        :root { --danger: #e74c3c; --dark: #2D3436; }
        body { font-family: 'Pretendard', sans-serif; background: #F4F7F6; margin: 0; padding-bottom: 100px; }
        header { background: var(--dark); color: white; padding: 20px; display: flex; align-items: center; }
        .back-btn { color: white; text-decoration: none; margin-right: 15px; }
        
        .report-box { background: white; margin: 15px; padding: 20px; border-radius: 12px; border-left: 5px solid var(--danger); }
        .report-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; color: var(--danger); }
        .evidence-img { width: 80px; height: 80px; background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999; margin-top: 10px; }
        
        .chat-log { background: #fff; margin: 15px; padding: 15px; border-radius: 12px; font-size: 13px; line-height: 1.6; border: 1px solid #ddd; }
        .chat-user { font-weight: bold; color: #007bff; }
        .chat-helper { font-weight: bold; color: #FF6B6B; }

        .admin-decision { padding: 20px; position: fixed; bottom: 0; width: 100%; background: white; display: flex; gap: 8px; box-sizing: border-box; }
        .btn-dec { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <a href="admin_dashboard.html" class="back-btn">←</a>
        <span>분쟁 조절 센터</span>
    </header>

    <div class="report-box">
        <div class="report-title">🚨 서비스 미이행 (노쇼) 신고</div>
        <div style="font-size: 14px; color: #636e72;">
            신고자: James (여행자)<br>
            피신고자: 박철수 (헬퍼)
        </div>
        <p style="font-size: 15px; margin-top: 15px;">"약속 장소에 30분 넘게 나타나지 않고 연락도 되지 않았습니다."</p>
        <div class="evidence-img">증거 사진1<br>(채팅 캡쳐)</div>
    </div>

    <div class="chat-log">
        <strong style="display: block; margin-bottom: 10px;">💬 관련 채팅 로그 (요약)</strong>
        <span class="chat-user">[James]</span> 저 도착했습니다. 어디계세요?<br>
        <span class="chat-user">[James]</span> 15분 지났는데 응답이 없으시네요.<br>
        <span class="chat-helper">[박철수]</span> (응답 없음)
    </div>

    <div class="admin-decision">
        <button class="btn-dec" style="background:#eee;" onclick="confirm('신고를 기각하시겠습니까?')">신고 기각</button>
        <button class="btn-dec" style="background:#f1c40f; color:white;" onclick="confirm('헬퍼에게 주의 조치를 내리겠습니까?')">헬퍼 경고</button>
        <button class="btn-dec" style="background:var(--danger); color:white;" onclick="confirm('여행자에게 전액 환불을 진행하시겠습니까?')">전액 환불</button>
    </div>
</body>
</html>
