<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Private Request - My Local Mate</title>
    <style>
        :root {
            --vip-gold: #D4AF37;
            --vip-dark: #1C1C1C;
            --vip-gray: #f4f4f4;
            --text-main: #ffffff;
            --text-sub: #b2bec3;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--vip-dark);
            color: var(--text-main);
            padding-bottom: 100px;
        }

        header {
            padding: 30px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .back-btn { text-decoration: none; color: var(--vip-gold); font-size: 24px; margin-right: 15px; }
        header h2 { margin: 0; font-size: 18px; font-weight: 300; letter-spacing: 2px; color: var(--vip-gold); }

        .hero-section {
            padding: 40px 20px;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .hero-section p {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        /* 테마 선택 라디오 그룹 */
        .theme-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 20px 30px;
        }

        .theme-item input { display: none; }
        .theme-item label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 110px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-item label .icon { font-size: 24px; margin-bottom: 8px; }
        .theme-item label .label-text { font-size: 14px; font-weight: 600; }
        .theme-item label .sub-text { font-size: 10px; color: var(--text-sub); margin-top: 4px; }

        .theme-item input:checked + label {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--vip-gold);
            transform: translateY(-5px);
        }

        /* 기본 정보 입력 영역 */
        .input-section {
            padding: 0 20px;
        }

        .input-group { margin-bottom: 25px; }
        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--vip-gold);
            margin-bottom: 10px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            color: white;
            padding: 12px 0;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }

        input:focus { border-bottom: 1px solid var(--vip-gold); }

        .row { display: flex; gap: 20px; }
        .row div { flex: 1; }

        /* 하단 고정 버튼 */
        .footer-action {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 20px;
            background: linear-gradient(transparent, var(--vip-dark) 30%);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--vip-gold);
            color: var(--vip-dark);
            border: none;
            padding: 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        ::placeholder { color: #555; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <a href="javascript:history.back();" class="back-btn">←</a>
        <h2>PREMIUM PRIVATE REQUEST</h2>
    </header>

    <div class="hero-section">
        <h1>오직 당신만을 위한<br>예술적인 여정의 시작</h1>
        <p>선호하시는 테마와 최소한의 정보만 들려주세요.<br>최고의 컨시어지가 당신만의 시나리오를 기획합니다.</p>
    </div>

    <form onsubmit="event.preventDefault(); alert('품격 있는 제안서로 찾아뵙겠습니다. 잠시만 기다려 주십시오.'); location.href='traveler.html';">
        
        <div class="input-section"><label style="color:var(--vip-gold); font-size:12px; font-weight:700;">SELECT THEME</label></div>
        <div class="theme-grid" style="margin-top:15px;">
            <div class="theme-item">
                <input type="radio" name="theme" id="t1" checked>
                <label for="t1">
                    <span class="icon">💼</span>
                    <span class="label-text">글로벌 비즈니스</span>
                    <span class="sub-text">성공적인 파트너십을 위한 의전</span>
                </label>
            </div>
            <div class="theme-item">
                <input type="radio" name="theme" id="t2">
                <label for="t2">
                    <span class="icon">🍷</span>
                    <span class="label-text">헤리티지 웰니스</span>
                    <span class="sub-text">품격 있는 휴식과 장수(Longevity)</span>
                </label>
            </div>
            <div class="theme-item">
                <input type="radio" name="theme" id="t3">
                <label for="t3">
                    <span class="icon">💍</span>
                    <span class="label-text">이터널 커플</span>
                    <span class="sub-text">둘만의 시네마틱한 순간</span>
                </label>
            </div>
            <div class="theme-item">
                <input type="radio" name="theme" id="t4">
                <label for="t4">
                    <span class="icon">🎨</span>
                    <span class="label-text">아트 & 컬쳐</span>
                    <span class="sub-text">예술적 영감과 프라이빗 도슨트</span>
                </label>
            </div>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label>DESTINATION</label>
                <input type="text" placeholder="방문 희망 도시 (예: 파리, 피렌체, 제주)" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>EXPECTED DATE</label>
                    <input type="date" required>
                </div>
                <div class="input-group">
                    <label>GUESTS</label>
                    <input type="number" placeholder="인원 수" style="width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.3); color: white; padding: 12px 0; outline: none;">
                </div>
            </div>

            <div class="input-group">
                <label>PRIVATE NOTE</label>
                <textarea placeholder="컨시어지가 참고해야 할 특별한 요청사항이 있다면 들려주세요. (알러지, 선호 브랜드, 금기사항 등)"></textarea>
            </div>
        </div>

        <div class="footer-action">
            <button type="submit" class="btn-submit">프라이빗 제안서 요청하기</button>
        </div>
    </form>

</body>
</html>
