<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 - My Local Mate</title>
    <style>
        /* 공통 색상 변수 */
        :root {
            --primary-color: #FF6B6B;
            --primary-dark: #ee5253;
            --bg-color: #F8F9FA;
            --text-color: #2D3436;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 상단 헤더 (뒤로가기) */
        header {
            background-color: #ffffff;
            padding: 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eee;
            position: relative;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-color);
            font-size: 20px;
            margin-right: 15px;
        }

        header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 메인 콘텐츠 영역 */
        main {
            flex: 1;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-area h1 {
            color: var(--primary-color);
            margin: 0 0 10px 0;
            font-size: 32px;
            letter-spacing: -1px;
        }

        .logo-area p {
            color: #636e72;
            margin: 0;
            font-size: 15px;
        }

        /* 이메일 로그인 폼 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-group input {
            padding: 16px;
            border: 1px solid #dfe6e9;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        .login-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }

        .login-btn:active {
            background-color: var(--primary-dark);
        }

        /* 비밀번호 찾기 등 부가 링크 */
        .sub-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 13px;
            color: #b2bec3;
            margin-bottom: 30px;
        }

        .sub-links a {
            color: #636e72;
            text-decoration: none;
        }

        /* 구분선 */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #b2bec3;
            font-size: 13px;
            margin: 20px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dfe6e9;
        }

        .divider::before { margin-right: .5em; }
        .divider::after { margin-left: .5em; }

        /* 소셜 로그인 버튼 그룹 */
        .social-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .social-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: transform 0.1s;
        }

        .social-circle:active {
            transform: scale(0.95);
        }

        .circle-kakao { background-color: #FEE500; color: #3C1E1E; }
        .circle-naver { background-color: #03C75A; color: #ffffff; font-weight: 900;}
        .circle-google { background-color: #ffffff; color: #333333; border: 1px solid #e0e0e0; }

    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">←</a>
        <h2>로그인</h2>
    </header>

    <main>
        <div class="logo-area">
            <h1>My Local Mate</h1>
            <p>다시 뵙게 되어 반가워요!</p>
        </div>

        <div class="input-group">
            <input type="email" placeholder="이메일 주소" required>
            <input type="password" placeholder="비밀번호" required>
        </div>

        <button type="button" class="login-btn" onclick="alert('로그인 되었습니다! (데모)'); location.href='traveler.html'">로그인</button>

        <div class="sub-links">
            <a href="#">비밀번호 찾기</a>
            <span>|</span>
            <a href="signup.html">회원가입</a>
        </div>

        <div class="divider">간편 로그인</div>

        <div class="social-group">
            <a href="#" class="social-circle circle-kakao">K</a>
            <a href="#" class="social-circle circle-naver">N</a>
            <a href="#" class="social-circle circle-google">G</a>
        </div>
    </main>

</body>
</html>
